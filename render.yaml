# Render Blueprint for the API. In Render: New > Blueprint > pick this repo.
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: memed-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev: TypeScript is a dev dependency and NODE_ENV=production would skip it.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
